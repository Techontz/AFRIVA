# Temporary site used only before the first certificate exists (install-nginx.sh swaps it for the
# real site once certbot has issued api.afriva.co.tz).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / { return 404; }
}
