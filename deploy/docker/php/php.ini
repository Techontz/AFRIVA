; Afriva production PHP overrides (loaded after php.ini-production).

expose_php = Off
memory_limit = 256M
max_execution_time = 60
max_input_time = 60
max_input_vars = 3000

; Images only go through PHP (videos go straight to Bunny over TUS).
; A drama form can carry poster + backdrop (8 MB each by validation), so the body limit is larger
; than one file. Keep client_max_body_size in Nginx equal to post_max_size.
upload_max_filesize = 10M
post_max_size = 25M
max_file_uploads = 10

date.timezone = UTC
default_charset = "UTF-8"

display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED

session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_secure = 1

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Laravel uses pcntl for queue:work timeouts and signals.
disable_functions =
