# Laravel API: https://__API_DOMAIN__  (certbot adds the TLS lines)
server {
    listen 80;
    listen [::]:80;
    server_name __API_DOMAIN__;

    root /var/www/afriva/backend/public;
    index index.php;
    charset utf-8;

    # Episode uploads up to 500 MB (keep in sync with PHP post_max_size).
    client_max_body_size 520M;
    client_body_timeout 300s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;

    # Posters, backdrops and thumbnails (public disk). Videos are NOT stored here.
    location /storage/ {
        expires 30d;
        add_header Cache-Control "public";
        # Public files; subtitle tracks (.vtt) are loaded cross-origin by the website's player.
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # Private episode videos. Only reachable via X-Accel-Redirect from Laravel after the
    # signed URL is checked (see config/media.php); a direct request returns 404.
    location /_protected_videos/ {
        internal;
        alias /var/www/afriva/backend/storage/app/private/videos/;
        sendfile on;
        tcp_nopush on;
        aio threads;
        output_buffers 1 512k;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "private, max-age=21600";
        # hls.js on the website fetches segments cross-origin; access is already limited by the signed, expiring URL.
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Vary Origin always;
    }

    # Rate limits: login/register tightly, the rest of the API generously.
    location ~ ^/api/v1/auth/(login|register) {
        limit_req zone=afriva_auth burst=10 nodelay;
        try_files $uri /index.php?$query_string;
    }
    location /api/ {
        limit_req zone=afriva_api burst=60 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
