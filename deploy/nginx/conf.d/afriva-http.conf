# Afriva: http-level Nginx settings. Installed as /etc/nginx/conf.d/afriva-http.conf
# (Ubuntu's nginx.conf includes conf.d/*.conf inside the http block).

server_tokens off;

# Real client IP from Cloudflare. The snippet lists Cloudflare ranges and is refreshed weekly by
# deploy/scripts/update-cloudflare-ips.sh. CF-Connecting-IP is only trusted from those ranges.
include /etc/nginx/snippets/cloudflare-realip.conf;

# Rate limiting (per real client IP). Laravel has its own per-route throttles; these zones stop
# floods before they reach PHP. Many Tanzanian mobile users share carrier NAT addresses, so the
# limits are deliberately generous.
limit_req_zone $binary_remote_addr zone=afriva_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=afriva_api:20m  rate=20r/s;
limit_conn_zone $binary_remote_addr zone=afriva_conn:10m;
limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;

# Compression for JSON (Cloudflare also compresses; this covers direct origin traffic).
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types application/json application/javascript text/css text/plain text/xml application/xml image/svg+xml;

# Access log with timings, used by server-management.md examples.
log_format afriva '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" rt=$request_time urt=$upstream_response_time '
                  'cf_ray=$http_cf_ray';
