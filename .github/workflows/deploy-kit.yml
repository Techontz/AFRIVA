# Validates the server deployment kit (deploy/): shellcheck, compose config, nginx -t, and a full build
# of the production API image with a smoke test. Nothing is pushed or deployed.
name: Deploy kit

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "backend/**"
      - ".github/workflows/deploy-kit.yml"
  pull_request:
    paths:
      - "deploy/**"
      - "backend/**"
      - ".github/workflows/deploy-kit.yml"

concurrency:
  group: deploy-kit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Shellcheck, compose config, nginx -t
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: shellcheck -x deploy/scripts/*.sh deploy/docker/php/docker-entrypoint.sh

      - name: docker compose config
        run: |
          cp deploy/.env.production.example "$RUNNER_TEMP/ci.env"
          sed -i 's/^DB_PASSWORD=$/DB_PASSWORD=ci/; s/^MYSQL_ROOT_PASSWORD=$/MYSQL_ROOT_PASSWORD=ci/; s/^REDIS_PASSWORD=$/REDIS_PASSWORD=ci/' "$RUNNER_TEMP/ci.env"
          AFRIVA_IMAGE_TAG=ci docker compose -f deploy/docker-compose.prod.yml --env-file "$RUNNER_TEMP/ci.env" config -q

      # nginx 1.24 matches Ubuntu 24.04's packaged version.
      - name: nginx -t
        run: |
          mkdir -p "$RUNNER_TEMP/le"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj "/CN=api.afriva.co.tz" \
            -keyout "$RUNNER_TEMP/le/privkey.pem" -out "$RUNNER_TEMP/le/fullchain.pem"
          docker run --rm \
            -v "$PWD/deploy/nginx/conf.d/afriva-http.conf:/etc/nginx/conf.d/afriva-http.conf:ro" \
            -v "$PWD/deploy/nginx/sites/api.afriva.co.tz.conf:/etc/nginx/conf.d/zz-api.conf:ro" \
            -v "$PWD/deploy/nginx/snippets:/etc/nginx/snippets:ro" \
            -v "$RUNNER_TEMP/le:/etc/letsencrypt/live/api.afriva.co.tz:ro" \
            nginx:1.24-alpine sh -c 'rm -f /etc/nginx/conf.d/default.conf && nginx -t'

      - name: YAML of workflows
        run: python3 -c "import sys,yaml; [yaml.safe_load(open(f)) for f in sys.argv[1:]]" .github/workflows/*.yml

  image:
    name: Build API image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        run: |
          docker buildx build --load \
            --build-context phpconf=deploy/docker/php \
            --build-arg GIT_SHA="${GITHUB_SHA}" \
            -f deploy/docker/php/Dockerfile -t afriva-api:ci backend

      - name: Smoke test
        run: |
          docker run --rm --entrypoint php afriva-api:ci -m
          docker run --rm --entrypoint php afriva-api:ci -r 'exit((gd_info()["WebP Support"] ?? false) && function_exists("exif_read_data") && extension_loaded("redis") && extension_loaded("pdo_mysql") ? 0 : 1);'
          docker run --rm --entrypoint php afriva-api:ci -i | grep -E '^opcache.validate_timestamps => Off'
          docker run --rm --entrypoint php afriva-api:ci artisan --version
          docker run --rm --entrypoint id afriva-api:ci
