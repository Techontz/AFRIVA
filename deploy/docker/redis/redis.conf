# Redis 7 for Afriva: cache, rate limiter and queue.
# The password is passed on the command line from REDIS_PASSWORD (see docker-compose.prod.yml).
bind 0.0.0.0
protected-mode yes
port 6379

# Persistence: append only file, fsync every second (queue jobs survive a restart).
appendonly yes
appendfsync everysec
save 900 1
save 300 100

# Memory: cache keys carry a TTL, queue lists do not. volatile-lru evicts only keys with a TTL,
# so under memory pressure the cache shrinks and queued jobs are never dropped.
maxmemory 512mb
maxmemory-policy volatile-lru

# Dangerous admin commands are disabled for clients.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
rename-command CONFIG ""

timeout 0
tcp-keepalive 300
loglevel notice
