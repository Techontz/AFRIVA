; OPcache for production. Code never changes inside a running container (a deploy builds a new
; image), so timestamp validation is off: no stat() calls per request.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1
opcache.max_wasted_percentage = 10
; JIT gives little for I/O bound Laravel requests and costs memory; leave it off.
opcache.jit = off
opcache.jit_buffer_size = 0
