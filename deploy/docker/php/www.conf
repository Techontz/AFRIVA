; Afriva FPM pool overrides (loaded after www.conf and zz-docker.conf of the official image).
; The master runs as the non-root "afriva" user, so the user/group directives of www.conf are ignored.
[www]
listen = 9000

; Sizing for a 4 vCPU / 8 GB box shared with MySQL (about 2 GB) and Redis.
; A Laravel API worker uses roughly 40 to 70 MB, so 24 children stay under about 1.7 GB.
pm = dynamic
pm.max_children = 24
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 10
pm.max_requests = 1000

; Health check target used by the compose healthcheck (cgi-fcgi). Not reachable from Nginx.
ping.path = /fpm-ping
ping.response = pong
pm.status_path = /fpm-status

request_terminate_timeout = 65s
request_slowlog_timeout = 5s
slowlog = /proc/self/fd/2

catch_workers_output = yes
decorate_workers_output = no
clear_env = no
access.log = /dev/null
