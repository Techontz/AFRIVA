# api.afriva.co.tz: Laravel API behind Cloudflare (proxied, SSL mode "Full (strict)").
# Installed by deploy/scripts/install-nginx.sh as /etc/nginx/sites-available/api.afriva.co.tz.conf.
# TLS: Let's Encrypt via certbot webroot (/var/www/certbot). Renewal reloads Nginx through
# /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh.

# Unknown hosts and direct-IP requests get nothing.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 444; }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# HTTP: ACME challenges, everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name api.afriva.co.tz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # "listen ... http2" form: Ubuntu 24.04 ships Nginx 1.24, which predates the "http2 on;" directive.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.afriva.co.tz;

    ssl_certificate     /etc/letsencrypt/live/api.afriva.co.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.afriva.co.tz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:afriva_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Optional: Cloudflare Authenticated Origin Pulls. When enabled in Cloudflare (SSL/TLS > Origin Server),
    # download Cloudflare's origin pull CA to /etc/nginx/certs/cloudflare-origin-pull-ca.pem and uncomment.
    # The origin then only answers TLS clients presenting Cloudflare's certificate. Note: Let's Encrypt
    # renewals over HTTP (port 80) keep working; direct HTTPS checks from the server itself will fail,
    # so deploy.sh health checks must then use HEALTH_VIA_PUBLIC=1.
    # ssl_client_certificate /etc/nginx/certs/cloudflare-origin-pull-ca.pem;
    # ssl_verify_client on;

    # Images only (posters, logos, ID documents). Videos go straight to Bunny over TUS, never here.
    # Keep equal to post_max_size in deploy/docker/php/php.ini.
    client_max_body_size 25m;
    client_body_timeout 60s;
    keepalive_timeout 30s;

    access_log /var/log/nginx/api.afriva.access.log afriva;
    error_log  /var/log/nginx/api.afriva.error.log warn;

    include /etc/nginx/snippets/afriva-security-headers.conf;

    limit_conn afriva_conn 40;

    # ACME over HTTPS too (Let's Encrypt follows Cloudflare's HTTP to HTTPS redirect if one is on).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # No dotfiles (.env, .git, ...), ever.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Laravel health route: no rate limit, no access log.
    location = /up {
        access_log off;
        include /etc/nginx/snippets/afriva-fastcgi.conf;
    }

    # Auth endpoints (login, register, studio application): strict per-IP limit.
    location ^~ /api/v1/auth/ {
        limit_req zone=afriva_auth burst=20 nodelay;
        include /etc/nginx/snippets/afriva-fastcgi.conf;
    }

    location /api/ {
        limit_req zone=afriva_api burst=60 nodelay;
        include /etc/nginx/snippets/afriva-fastcgi.conf;
    }

    # Public uploads on the local "public" disk (until they move to R2). Static files only; the private
    # disk (storage/app/private, ID documents) is never exposed here.
    location ^~ /storage/ {
        alias /srv/afriva/shared/storage/app/public/;
        expires 30d;
        include /etc/nginx/snippets/afriva-security-headers.conf;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;
        location ~ /\. { deny all; }
    }

    location = /favicon.ico { access_log off; log_not_found off; return 204; }
    location = /robots.txt  { access_log off; default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }

    # Everything else (the "/" index JSON, unknown routes) goes to Laravel with the general limit.
    location / {
        limit_req zone=afriva_api burst=60 nodelay;
        include /etc/nginx/snippets/afriva-fastcgi.conf;
    }
}
