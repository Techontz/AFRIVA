# Continuous integration: backend tests, website lint/types/build, Flutter analyze/tests.
# The website itself is deployed by Vercel's GitHub integration, not by a workflow.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Laravel tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, gd, exif, intl, zip, bcmath, redis
          coverage: none
          tools: composer:v2

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      # phpunit.xml already sets DB_CONNECTION=sqlite, DB_DATABASE=:memory:, CACHE_STORE=array, etc.
      - name: Run tests
        run: php artisan test

  web:
    name: Website (lint, types, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: afriva_web
    env:
      # Placeholders: the build must not depend on a live API. Real values live in Vercel.
      NEXT_PUBLIC_API_URL: https://api.example.invalid/api/v1
      NEXT_PUBLIC_SITE_URL: https://www.example.invalid
      NEXT_PUBLIC_ADMIN_URL: https://admin.example.invalid
      NEXT_PUBLIC_STUDIO_URL: https://studio.example.invalid
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: afriva_web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  app:
    name: Flutter app (analyze, test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The Flutter SDK download is heavy; a failure here is reported but does not block the run.
    continue-on-error: true
    defaults:
      run:
        working-directory: afriva_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
